<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究站爭奪戰 · 遊戲實景</title><style>*{box-sizing:border-box}body{margin:0;background:#102d25;color:#f1e7cb;font:15px/1.9 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 22px}small{font-size:10px;letter-spacing:.2em;color:#dab67b}h1{font-size:32px;line-height:1.5}p,figcaption{color:#b9cebd}a{color:#eed1a0}a.play{display:inline-block;background:#e3bd7a;color:#163426;text-decoration:none;padding:9px 21px;border-radius:4px;font-weight:700}figure{margin:28px 0}img{display:block;width:100%;height:auto;border:1px solid #ceb67744;border-radius:5px}figcaption{font-size:12px;margin-top:8px}</style></head><body><main><small>DINO ISLAND / RESEARCH ENCOUNTER 05</small><h1>研究站爭奪戰 · 遊戲實景</h1><p>電閘捷徑、西側步道與可步行登上的高台。啟動補給會讓警報、對手與恐龍一起改變戰局。</p><a class="play" href="../?v=research5">進入研究站 →</a><figure><img src="research-performance.png" alt="研究站、兩條進路、防護閘與斜坡高台"><figcaption>研究站導覽 · 流暢畫質 · 對局尚未開始</figcaption></figure><figure><img src="alarm.png" loading="lazy" alt="玩家實際啟動研究站警報與補給傳輸"><figcaption>一般鍵鼠操作 · 啟動警報、補給倒數</figcaption></figure><figure><img src="reward.png" loading="lazy" alt="玩家在對手之前取得有限研究站補給"><figcaption>實際領取 · 彈藥、急救與誘餌</figcaption></figure><figure><img src="high-ground.png" loading="lazy" alt="角色沿實體斜坡登上二點八公尺高台"><figcaption>實際沿斜坡登高 · 高台可避迅猛龍，仍會受到暴龍威脅</figcaption></figure><figure><img src="paddock-performance.png" loading="lazy" alt="原場景暴龍位於具有可破壞出口的圍場"><figcaption>暴龍圍場導覽 · 警報啟動後的破欄事件會解除出口碰撞</figcaption></figure><p>以上為目前版本的實際瀏覽器畫面。驗證過程使用一般移動、E、Q、Esc 和選單；雲端軟體繪圖結果不代表實體電腦效能。<a href="../promo/">15 秒宣傳片</a>採上一輪入口版本的宣傳運鏡。</p><p><a href="../art4/gallery/">前一輪入口美術畫面</a> · <a href="../?v=research5">返回試玩</a></p></main></body></html>
