<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巨獸觀察 · 模型與動作</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeee2;color:#294236;font:15px/1.85 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:42px 24px}small{font-size:10px;letter-spacing:.16em;color:#887a53}h1{font-size:34px}h2{font-size:22px;margin:32px 0 12px}a{color:inherit}a.play{display:inline-block;background:#294236;color:#f5edda;padding:10px 20px;margin:0 8px 8px 0;text-decoration:none;border-radius:3px}p,figcaption{color:#64715f}figure{margin:22px 0}img,video{display:block;width:100%;height:auto;background:#dfe3d7;border-radius:4px;border:1px solid #9daa9544}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}figcaption{font-size:12px}@media(max-width:650px){.compare{grid-template-columns:1fr}h1{font-size:27px}}</style></head><body><main><small>DINO ISLAND / CREATURE STUDY 06</small><h1>巨獸的輪廓、鱗皮與重量</h1><p>暴龍頭顎與口腔重建，四物種的皮膚、眼睛與細節，以及共享於遊戲和觀察室的動作反應。</p><a class="play" href="../creatures.html">打開可旋轉觀察室 ↗</a><a class="play" href="../?v=creatures6">進入遊戲 ↗</a><h2>暴龍近景 · 新舊模型</h2><div class="compare"><figure><img src="rex-before.png" alt="前版暴龍模型，同一組展示光線"><figcaption>前版模型與前版配色</figcaption></figure><figure><img src="rex-head.png" alt="本次暴龍頭顱、鱗皮、琥珀眼睛"><figcaption>本次細化模型 · 同一組光線與鏡頭</figcaption></figure></div><figure><img src="rex-mouth.png" alt="實際下顎張開，顯示上下牙齒、牙齦及舌頭"><figcaption>實際下顎骨骼與皮膚權重 · 動作進度控制選取的咬合姿勢</figcaption></figure><h2 id="motion">12 秒模型動作檢視</h2><video controls playsinline preload="metadata" poster="creature-motion-poster.png" src="creature-motion.mp4"></video><p>步行、奔跑、轉身、咬合。使用觀察室的實際 GLB、動畫與動作程式逐格輸出；原地模型展示，非玩家追逐錄影。影片無聲。</p><h2>其他物種</h2><figure><img src="raptor-head.png" loading="lazy" alt="迅猛龍暖褐色皮膚與眼睛"><figcaption>迅猛龍 · 條紋、眼睛、鐮刀爪</figcaption></figure><figure><img src="trike-head.png" loading="lazy" alt="三角龍頭盾、角與厚皮"><figcaption>三角龍 · 頭盾、角質護緣、角與厚皮</figcaption></figure><figure><img src="brachio-full.png" loading="lazy" alt="腕龍灰綠皮膚與長頸全身"><figcaption>腕龍 · 灰綠鱗皮與腹側分區</figcaption></figure><h2>放回園區</h2><figure><img src="rex-game.png" loading="lazy" alt="遊戲圍場中的細化暴龍"><figcaption>實際遊戲場景 · 暴龍導覽</figcaption></figure><p>這輪沿用原有基本體型與主要動畫，再修改幾何、材質與動作。沒有完整足部 IK。軟體繪圖畫面不代表實體裝置效能。</p><p><a href="../research5/gallery/">前一輪研究站</a> · <a href="../promo/">園區宣傳片</a> · <a href="../creatures.html">返回觀察室</a></p></main></body></html>
